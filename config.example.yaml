app:
  interval_days: 3
  run_on_startup: true
  dry_run: true
  max_deletes_per_run: 25
  state_path: /data/state.json

ptp:
  base_url: https://passthepopcorn.me
  unregistered_path: /userhistory.php
  timeout_seconds: 30
  min_interval_seconds_between_pages: 5

matching:
  require_tracker_contains: "passthepopcorn"
  include_categories: []
  exclude_categories: []
  include_tags: []
  exclude_tags: []

# Optional: ask Radarr to acquire PTP-designated trump replacements before
# removing the obsolete qBittorrent entry. Keep disabled through dry-run setup.
radarr:
  enabled: false
  url: http://radarr:7878
  # Replace with ${RADARR_API_KEY} when enabling.
  api_key: ""
  timeout_seconds: 30
  torznab_host: 0.0.0.0
  torznab_port: 9697
  # Address Radarr can use to reach this container/host (no trailing /api).
  torznab_external_url: http://ptp-unregistered-cleaner:9697
  # Replace with ${TORZNAB_API_KEY} when enabling.
  torznab_api_key: ""
  # Leave true: an unsafe/failed replacement preserves the old entry for retry.
  preserve_on_failure: true

qbittorrent:
  - name: main
    url: http://qbittorrent:8080
    username: ${QBIT_MAIN_USERNAME}
    password: ${QBIT_MAIN_PASSWORD}
  - name: seedbox
    url: https://example.invalid
    username: ${QBIT_SEEDBOX_USERNAME}
    password: ${QBIT_SEEDBOX_PASSWORD}
